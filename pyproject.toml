[project]
name = "project-lens"
version = "0.1.0"
description = "AI-powered project knowledge base and indexer"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "python-telegram-bot>=21.0",
    "chromadb>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
